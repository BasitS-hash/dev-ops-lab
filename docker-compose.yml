---
services:
  web:
    build:
      context: ./app
    ports:
      - "5000:5000"
    environment:
      LOG_LEVEL: "INFO"
      APP_ENV: "development"
      APP_VERSION: "1.0.0"
      PORT: "5000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - devops-net

networks:
  devops-net:
    driver: bridge
