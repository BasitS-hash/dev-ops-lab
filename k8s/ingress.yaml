---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-lab
  namespace: devops-lab
  labels:
    app: devops-lab
    app.kubernetes.io/name: devops-lab
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: devops-lab.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devops-lab
                port:
                  number: 80

  # TLS: uncomment + configure cert-manager before enabling in production.
  # 1. Install cert-manager: https://cert-manager.io/docs/installation/
  # 2. Create a ClusterIssuer (e.g. letsencrypt-prod)
  # 3. Add cert-manager.io/cluster-issuer annotation and uncomment tls block.
  # tls:
  #   - hosts:
  #       - devops-lab.local
  #     secretName: devops-lab-tls
