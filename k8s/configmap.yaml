---
apiVersion: v1
kind: ConfigMap
metadata:
  name: devops-lab-config
  namespace: devops-lab
  labels:
    app: devops-lab
    app.kubernetes.io/name: devops-lab
data:
  LOG_LEVEL: "INFO"
  APP_ENV: "production"
  app.properties: |
    server.port=5000
    server.timeout=30
    cache.enabled=true
    cache.ttl=300
    metrics.enabled=true
