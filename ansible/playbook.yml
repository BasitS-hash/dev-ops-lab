---
- name: Example local provisioning playbook
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Ensure docker is installed (Ubuntu/Debian example)
      become: yes
      apt:
        name: docker.io
        state: present
      when: ansible_os_family == 'Debian'

    - name: Pull local dev image if available
      shell: docker pull devops-lab:latest || true
      changed_when: false

    - name: Print message
      debug:
        msg: "Ansible playbook ran successfully"
