---
- name: Deploy DevOps Lab Application
  hosts: webservers
  become: false
  gather_facts: false

  pre_tasks:
    - name: Announce deployment start
      ansible.builtin.debug:
        msg: "Starting deployment of {{ app_name }} v{{ app_version }}"

  roles:
    - role: app-deploy

  post_tasks:
    - name: Announce deployment complete
      ansible.builtin.debug:
        msg: >-
          {{ app_name }} v{{ app_version }} deployed successfully.
          Listening on port {{ app_port }}.
          Health endpoint: http://localhost:{{ app_port }}{{ healthcheck_path }}
