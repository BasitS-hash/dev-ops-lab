version: 2

updates:
  # ── GitHub Actions ────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: "monthly"
      day: monday
      time: "09:00"
      timezone: America/Toronto
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(deps)"

  # ── Python (pip) ──────────────────────────────────────────────────────────
  - package-ecosystem: pip
    directory: /app
    schedule:
      interval: "monthly"
      day: monday
      time: "09:00"
      timezone: America/Toronto
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: "monthly"
      day: monday
      time: "09:00"
      timezone: America/Toronto
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - python
      - dev-tooling
    commit-message:
      prefix: "chore(deps)"

  # ── Docker ────────────────────────────────────────────────────────────────
  - package-ecosystem: docker
    directory: /app
    schedule:
      interval: "monthly"
      day: monday
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "chore(deps)"
