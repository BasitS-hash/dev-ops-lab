version: 2

# Grouping policy
# ---------------
# Each ecosystem groups its minor + patch updates into ONE pull request.
# Ungrouped, this repo accumulated 14 open PRs against a codebase of a few
# hundred lines — the queue was larger than the project.
#
# Major bumps stay ungrouped: they carry breaking changes and deserve an
# individual PR that can be judged (or closed) on its own.

updates:
  # ── GitHub Actions ────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: "monthly"
      day: monday
      time: "09:00"
      timezone: America/Toronto
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions-all:
        patterns: ["*"]

  # ── Python (pip) ──────────────────────────────────────────────────────────
  - package-ecosystem: pip
    directory: /app
    schedule:
      interval: "monthly"
      day: monday
      time: "09:00"
      timezone: America/Toronto
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - python
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: "monthly"
      day: monday
      time: "09:00"
      timezone: America/Toronto
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - python
      - dev-tooling
    commit-message:
      prefix: "chore(deps)"
    groups:
      dev-tooling-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # ── Docker ────────────────────────────────────────────────────────────────
  - package-ecosystem: docker
    directory: /app
    schedule:
      interval: "monthly"
      day: monday
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "chore(deps)"
    groups:
      docker-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
